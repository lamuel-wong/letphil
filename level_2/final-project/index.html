<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Shift and Goal Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="app-title">Weekly Shift and Goal Planner</h1>

        <div class="header-info">
          <p id="current-date">Date</p>
          <p id="current-time">Time</p>
        </div>
      </header>

      <div class="app-layout">
        <!-- Side Navigation Bar -->
        <aside class="sidebar">
          <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-link">Dashboard</a>
            <a href="#planner" class="nav-link">Weekly Planner</a>
            <a href="#goals" class="nav-link">Goals</a>
            <a href="#previous-weeks" class="nav-link">Previous Weeks</a>
            <a href="#contact" class="nav-link">Contact</a>
          </nav>
        </aside>

        <!-- Main Body -->
        <main class="main-content">
          <!-- Dashboard -->
          <section id="dashboard" class="dashboard">
            <!-- Summary cards -->
            <div class="dashboard-summary">
              <article class="summary-card">
                <h2>Goals Completed</h2>
                <p id="goals-completed-value">0 / 0</p>
              </article>

              <article class="summary-card">
                <h2>Study Hours</h2>
                <p id="study-hours-value">0 h</p>
              </article>

              <article class="summary-card">
                <h2>Upcoming Shift</h2>
                <p id="next-shift-value">None</p>
              </article>
            </div>
          </section>

          <!-- Weekly Planner -->
          <div class="planner-layout">
            <section id="planner" class="planner">
              <div class="section-header">
                <h2>Weekly Planner</h2>
                <p id="week-range">Month Day - Month Day</p>
              </div>
              <form id="schedule-form" class="schedule-form">
                <div class="form-group">
                  <label for="schedule-title">Title</label>
                  <input id="schedule-title" type="text" required />
                </div>

                <div class="form-group">
                  <label for="schedule-type">Type</label>
                  <select id="schedule-type" required>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                    <option value="gym">Gym</option>
                    <option value="commitment">Commitment</option>
                    <option value="other">Other</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="schedule-date">Date</label>
                  <input id="schedule-date" type="date" required />
                </div>

                <div class="form-group">
                  <label for="schedule-start-time">Start Time</label>
                  <input id="schedule-start-time" type="time" required />
                </div>

                <div class="form-group">
                  <label for="schedule-end-time">End Time</label>
                  <input id="schedule-end-time" type="time" required />
                </div>

                <button id="schedule-submit-btn" type="submit">
                  Add Schedule
                </button>

                <button id="cancel-edit-btn" type="button" hidden>
                  Cancel
                </button>
              </form>

              <div id="weekly-planner" class="weekly-planner">
                <!-- Day columns and schedule cards rendered by JS  -->
              </div>
            </section>

            <!-- Goal Tracker -->
            <section id="goals" class="goals-tracker">
              <h2>Goals Tracker</h2>
              
              <form id="goal-form" class="goal-form">
                <div class="form-group">
                  <label for="goal-title">Goal Title</label>
                  <input id="goal-title" type="text" required />
                </div>

                <div class="form-group">
                  <label for="goal-target">Target</label>
                  <input id="goal-target" type="number" min="1" required />
                </div>

                <div class="form-group">
                  <label for="goal-unit">Tracking Unit</label>
                  <select id="goal-unit" required>
                    <option value="sessions">Sessions</option>
                    <option value="hours">Hours</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="goal-linked-type">Linked Activity</label>
                  <select id="goal-linked-type" required>
                    <option value="gym">Gym</option>
                    <option value="study">Study</option>
                    <option value="work">Work</option>
                    <option value="commitment">Commitment</option>
                    <option value="other">Other</option>
                  </select>
                </div>

                <button id="goal-submit-btn" type="submit">Add Goal</button>

                <button id="cancel-goal-edit-btn" type="button" hidden>
                  Cancel
                </button>
              </form>

              <div id="goal-list"></div>
            </section>
          </div>

          <section id="previous-weeks" class="previous-weeks">
            <h2>Previous Weeks</h2>

            <div id="previous-weeks-list"></div>
          </section>

          <section id="contact" class="contact">
            <h2>Feedback / Contact</h2>
          </section>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
